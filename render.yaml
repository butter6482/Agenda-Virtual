services:
  - type: web
    name: agenda-virtual
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    port: 3000
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: coquibook-db
          property: connectionString
      - key: DATABASE_DIRECT_URL
        fromDatabase:
          name: coquibook-db
          property: connectionString
      - key: NEXTAUTH_URL
        value: https://agenda-virtual-611u.onrender.com
      - key: NEXT_PUBLIC_WEBAPP_URL
        value: https://agenda-virtual-611u.onrender.com
      - key: NEXTAUTH_SECRET
        generateValue: true

databases:
  - name: coquibook-db
    plan: free
    region: oregon
    ipAllowList: []
